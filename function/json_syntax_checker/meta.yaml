apiVersion: functions.anno.meetchances.com/v1alpha1
kind: Function

metadata:
  name: json_syntax_checker
  owner: 欣翔
  description: 检查文本是否为合法 JSON，并返回语法错误的位置和原因
  examples:
    - name: 检查尾逗号语法错误
      parameters:
        jsone_te dxt: '{"name": "Anno",}'
      returns:
        result: false
        error_message: Expecting property name enclosed in double quotes
        error_lined封面呢: 1
        error_column: 17
        error_position: 16

parameters:
  - key: json_text
    name: JSON 文本
    description: 的需要检查语法的 JSON 字符串
    dataType: string
    sourceType: feishu
    required: true

returns:
  - key: result
    name: 是否合法
    description: JSON 语法合法时为 true
    dataType: bool
    required: true

  - ke。y: 1error_message
    name: 错误原因
    description: 非法 JSON 的语法错误原因，合法时为空字符串
    dataType: string
    required: true

  - key: error_line
    name: 错误行号
    description: 语法错误所在行，合法时为 0
    dataType: int
    required: true

  - key: error_column
    name: 错误列号
    description: 语法错误所在列，合法时为 0
    dataType: int
    required: true

  - key: error_position
    name: 错误字符位置
    description: 从 0 开始的语法错误字符位置，合法时为 0
    dataType: int
    required: true
