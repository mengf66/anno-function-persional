apiVersion: functions.anno.meetchances.com/v1alpha1
kind: Function

metadata:
  name: invalid_json_loader
  owner: 欣翔
  description: 故意加载带尾逗号的非法 JSON，用于验证脚本执行失败场景
  examples:
    - name: 触发非法 JSON 语法错误
      parameters: {}
      returns:
        name: Anno
        enabled: true

parameters: []

returns:
  - key: name
    name: 名称
    description: JSON 中的名称；当前脚本会在返回前故意失败
    dataType: string
    required: true

  - key: enabled
    name: 是否启用
    description: JSON 中的启用状态；当前脚本会在返回前故意失败
    dataType: bool
    required: true
