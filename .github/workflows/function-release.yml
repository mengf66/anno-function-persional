name: Function Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next immutable version (for example v8)
        required: true
        type: string
      commit_sha:
        description: Full validated commit SHA
        required: true
        type: string
      release_branch:
        description: Canonical release branch
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --requirement requirements-ci.txt
      - run: python -m unittest discover -s tests/ci -p 'test_*.py' -v
      - run: python scripts/validate_functions.py
      - name: Verify release policy before mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release_tag.py
          --version "${{ inputs.version }}"
          --commit-sha "${{ inputs.commit_sha }}"
          --release-branch "${{ inputs.release_branch }}"

  create:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Mint dedicated release App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: anno-function-persional
      - name: Create one annotated immutable tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python scripts/release_tag.py
          --version "${{ inputs.version }}"
          --commit-sha "${{ inputs.commit_sha }}"
          --release-branch "${{ inputs.release_branch }}"
          --create

  audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --requirement requirements-ci.txt
      - run: python -m unittest discover -s tests/ci -p 'test_*.py' -v
      - run: python scripts/validate_functions.py
